	<style>
	  /* =========================================
		 기본 및 공통 레이아웃

		line-height: 1.6;

	  input[type="number"], 
	  select,

		padding: 5px; 
		border: 1px solid #ccc; 
		border-radius: 4px; 
	  }

	  .top-controls { 
		display: flex; 
		gap: 10px; 
		margin-bottom: 20px; 
		flex-wrap: wrap; 
		padding: 15px; 
		background: #e9ecef; 
		border-radius: 5px; 
	  }

	  /* =========================================
		 공통 색상
		 ========================================= */
	  /* 청록색 테마 */
	  .nav-home, .btn-info { background-color: #17a2b8; }
	  .nav-home:hover, .btn-info:hover { background-color: #138496; }

	  /* 파란색 테마 */
	  .nav-plan, .btn-primary { background-color: #0056b3; }
	  .nav-plan:hover, .btn-primary:hover:not(:disabled) { background-color: #004494; }

	  /* 회색 테마 */
	  .nav-sim, .nav-github, .btn-secondary { background-color: #6c757d; }
	  .nav-sim:hover, .nav-github:hover, .btn-secondary:hover { background-color: #5a6268; }

	  /* 모든 주요 버튼 텍스트 공통 색상 */
	  .btn-primary, .btn-success, .btn-danger, .btn-secondary, .btn-info, .btn-capture {

	  }

	  /* =========================================
		 네비게이션

		padding: 12px;

	  .nav-menu a {

		color: white; 
		transition: background-color 0.3s;

	  /* =========================================
		 버튼
		 ========================================= */

	  /* disabled 상태 공통 */

		height: 16px;
		font-size: 11px;
		margin-left: 5px;
		font-weight: bold; 
	  }

	  .tooltip .tooltiptext { 
		visibility: hidden; 
		width: 280px; 
		background-color: #333; 
		color: #fff; 
		text-align: left; 
		border-radius: 6px; 
		padding: 10px; 
		position: absolute; 
		z-index: 10; 
		bottom: 130%; 
		left: 50%; 
		transform: translateX(-50%); 
		opacity: 0; 
		transition: opacity 0.3s; 
		font-weight: normal; 
		line-height: 1.4; 
		font-size: 12px; 
		box-shadow: 0px 4px 6px rgba(0,0,0,0.3); 
		white-space: normal; 
	  }

	  .tooltip .tooltiptext::after { 
		content: ""; 
		position: absolute; 
		top: 100%; 
		left: 50%; 
		margin-left: -5px; 
		border-width: 5px; 
		border-style: solid; 
		border-color: #333 transparent transparent transparent; 
	  }

	  .tooltip:hover .tooltiptext { 
		visibility: visible; 
		opacity: 1; 
	  }
	  
	  /* =========================================
		 모바일 최적화
		 ========================================= */

	  }

		body { padding: 10px; }
		
		/* 입력 그룹 및 라벨이 세로로 배치되도록 수정 */
		.input-group { display: flex; flex-direction: column; align-items: flex-start; }
		label { width: 100%; margin-bottom: 5px; white-space: normal; }
		
		/* 모든 인풋 박스가 화면 너비에 맞게 축소되도록 강제 적용 */
		input[type="text"], 
		input[type="number"], 
		select {

		  max-width: 100%; 
		  box-sizing: border-box; 
		}

		/* 기간 설정 폼 레이아웃 유연화 */
		.period-header { flex-wrap: wrap; }
		.period-header .p_memo { width: 100%; margin-top: 5px; }
		.ceiling-wrapper, .ceiling-th-container { display: flex; flex-direction: column; align-items: flex-start; width: 100%; }

		.tooltip .tooltiptext {
		  position: fixed;
		  top: 50%;
		  left: 50%;
		  transform: translate(-50%, -50%); /* 화면 정중앙에 배치 */
		  width: 85%; 
		  max-width: 320px;
		  bottom: auto;
		  z-index: 9999; /* 다른 요소들보다 무조건 위에 오도록 설정 */
		  box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
		}
		
		.tooltip .tooltiptext::after {
		  display: none; /* 중앙 팝업 형태이므로 말풍선 꼬리는 숨김 처리 */
		}
	  }

<body>

	<!-- 파이썬 스크립트 본문 -->
	<script>

/**
 * [상위 N% 계산 함수]
 * 누적 확률 분포를 분석하여 상위 N%에 해당하는 가챠 횟수를 추출
 * @param {number[]} dist - 각 가챠 횟수에서 목표를 달성할 확률이 담긴 배열
 * @param {number[]} pctList - 관찰하고자 하는 상위 % 목록 (예: [1, 5, 50, 99])
 * @returns {Object} { 백분위수: 가챠 횟수 } 형태의 객체 반환
 */
function getPercentiles(dist, pctList) {
	// 1. 관찰할 % 값을 소수점 확률로 변환 (예: 50% -> 0.5)
	const pcts = {};
	pctList.forEach(k => pcts[k] = k / 100.0);
	
	const res = {};
	let cum = 0.0; // 누적 확률
	
	// 오름차순으로 정렬하여 순차적으로 탐색
	const sortedKeys = [...pctList].sort((a, b) => a - b);
	let kIdx = 0;
	
	for (let i = 0; i < dist.length; i++) {
		cum += dist[i]; 
		
		// 누적 확률이 관찰 행운도를 넘어서는 순간의 뽑기 횟수를 기록
		while (kIdx < sortedKeys.length && cum >= pcts[sortedKeys[kIdx]]) {
			res[sortedKeys[kIdx]] = i;
			kIdx++;
		}
		
		// 모든 관찰 대상을 다 찾았다면 계산을 조기 종료
		if (kIdx >= sortedKeys.length) break;
	}
	return res;
}

/**
 * [확률 합성 함수 (Convolution)]
 * 여러 픽업 기간을 거칠 때, 이전 픽업의 결과와 다음 픽업의 결과를 합성해서
 * '총 누적 뽑기 횟수'의 확률 분포를 만듦
 * (예: A기간 1뽑 확률 * B기간 149뽑 확률 + A기간 2뽑 확률 * B기간 148뽑 확률 + ... + A기간 149뽑 확률 * B기간 1뽑 확률 = A~B기간 합산 150뽑 확률)
 * @param {number[]} dist1 - 이전 기간의 확률 분포
 * @param {number[]} dist2 - 현재 기간의 확률 분포
 * @param {number} pruneThreshold - 연산 속도 향상을 위해 버릴 극소 확률 기준
 * @returns {number[]} 합성된 새로운 확률 분포 배열
 */
function convolveDists(dist1, dist2, pruneThreshold = 1e-8) {
	if (!dist1 || dist1.length === 0) return dist2;
	if (!dist2 || dist2.length === 0) return dist1;

	const res = new Array(dist1.length + dist2.length - 1).fill(0.0);

	for (let i = 0; i < dist1.length; i++) {
		const p1 = dist1[i];
		// 너무 희박한 확률은 계산 속도를 위해 (설정에 따라) 가치지기 수행
		if (p1 < pruneThreshold) continue; 

		for (let j = 0; j < dist2.length; j++) {
			const p2 = dist2[j];
			if (p2 < pruneThreshold) continue;

			// 독립 시행이므로 두 확률을 곱해서 해당 총합(i+j) 횟수의 확률에 누적
			res[i + j] += p1 * p2; 
		}
	}
	return res;
}

/**
 * [시뮬레이션 함수]
 * 단일 픽업 기간 동안 목표를 달성하기까지의 확률과 자원을 계산
 * @param {number} nTargets - 목표 명함 수
 * @param {number} dDupes - 목표 중복 수
 * @param {string} systemType - 가챠 시스템의 타입("old", "new")
 * @param {boolean} isFes - Fes 가챠 여부
 * @param {boolean} hasFree100 - 무료 100회 모집 제공 여부
 * @param {boolean} is10Pull - 10연차 모드 여부
 * @param {boolean} useCeiling - 고의 천장 전략 사용여부
 * @param {number} ceilingTh - 고의 천장 전략 기준점
 * @param {map} initCDist - 신규 가챠의 이월 가능한 호출차지 스택 분포
 * @param {number} pruneThreshold - 확률 가지치기의 기준이 되는 임계값
 * @returns {Object} { avgPulls: 순소모 가챠횟수, avgEligma: 평균 획득 엘리그마, avgEleph: 평균 획득 목표 엘레프, pullsDist: 가챠 횟수 분포, endCDist: 잔여 호출차지 스택 분포 } 형태의 객체 반환
 */
function simulatePullsToTarget(params) {
	const {
		nTargets, dDupes, systemType = "new", isFes = false, hasFree100 = false,
		is10Pull = true, useCeiling = false, ceilingTh = 150,
		initCDist = null, pruneThreshold = 1e-8
	} = params;

	// 기본 확률 세팅
	const pPickup = 0.007; // 픽업 획득 확률 0.7%
	const pOffIndiv = isFes ? 0.001 : 0.0; // 페스 기간 픽뚫 페스캐 개별 확률
	const p3StarTotal = isFes ? 0.06 : 0.03; // 전체 3성 확률 (일반 3%, 페스 6%)
	const p2Star = 0.185; // 2성 확률 18.5%
	const p1Star = 1.0 - p3StarTotal - p2Star; // 나머지가 1성 확률
	
	const targetPickups = nTargets + dDupes;
	
	// 최대 필요 가챠 횟수 = 전부 천장을 친다고 가정했을 때의 횟수
	const maxPulls = targetPickups * 200 + (is10Pull ? 10 : 0);
	
	let pullsDist = new Array(maxPulls + 1).fill(0.0);
	let totalEligma = 0.0;
	let totalEleph = 0.0;
	let endCDist = new Map(); // 다음 픽업으로 이월될 호출차지 분포

	// ==========================================
	// 1. 기존 가챠 시스템 연산
	// ==========================================
	if (systemType === "old") {
		// dp: 현재 상태를 저장하는 평행 우주(경우의 수)
		// Map(획득한 캐릭터 수 => 그 상태가 될 확률) 구조임
		let dp = new Map();
		dp.set(0, 1.0); // 0명 획득 상태에서 확률 100%(1.0)로 시작

		for (let i = 1; i <= maxPulls; i++) {
			if (dp.size === 0) break; // 모든 우주에서 목표를 달성했다면 조기 종료
			
			let newDp = new Map();
			const isSpark = (i % 200 === 0) ? 1 : 0; // 천장 도달 여부를 나타내는 플래그
			const isGuaranteed2Star = is10Pull && (i % 10 === 0); // 10연차 최소 2성 보장 여부를 나타내는 플래그
			
			for (let [p, prob] of dp.entries()) {
				const remFes = Math.max(0, nTargets - p - 1); // 아직 뽑지 못한 페스캐(명함) 수
				const ownFes = Math.max(0, nTargets - 1) - remFes; // 이미 뽑은 페스캐(명함) 수
				
				const pBanner = pPickup; // 현재 배너의 픽업캐 확률
				const pOffTgt = isFes ? remFes * pOffIndiv : 0.0; // 아직 뽑지 못한 페스캐의 명함을 픽뚫로 얻을 확률, 페스 가챠가 아니라면 픽뚫 고려하지 않으므로 0%로 설정
				const pOwnFes = isFes ? ownFes * pOffIndiv : 0.0; // 이미 명함이 있는 페스캐를 픽뚫로 중복획득할 확률, 페스 가챠가 아니라면 픽뚫 고려하지 않으므로 0%로 설정
				const pTrash = 1.0 - pBanner - pOffTgt - pOwnFes; // 꽝 확률
				
				// 10연차 2성 보장 적용 (2성 보장시 1성 확률은 0%로 변경됨)
				const p2Act = isGuaranteed2Star ? (1.0 - p3StarTotal) : p2Star;
				const p1Act = isGuaranteed2Star ? 0.0 : p1Star;
				
				// 획득 자원 기댓값 계산 (우선 모든 3성을 중복으로 가정하고 계산)
				// 계산을 효율적으로 하기 위해 "이번에 나온 3성은 무조건 중복"이라고 일단 가정하고,
				// 무조건 엘리그마 50개를 획득하는 것으로 계산.
				// (나중에, 엘리그마가 지급되지 않는 명함 개수만큼 50개를 다시 빼줘서 오차 수정)
				const eEligma = (p3StarTotal * 50) + (p2Act * 10) + (p1Act * 1);
				const eEleph = (pBanner * 100) + (pOwnFes * 30); // 픽뚫 명함은 초회 엘레프 지급이 없으므로 pOffTgt에 대해선 합산하지 않음
				
				// 현재 평행우주 확률에 곱해서 총 기대 획득량을 누적
				totalEligma += prob * eEligma;
				totalEleph += prob * eEleph;
				
				// 천장에 도달하면 확정 보상을 가챠와는 별개로 추가 반영(교환 방식이므로). 역시 우선은 중복으로 가정하고, 추후 명함 개수만큼 50개씩 엘리그마를 빼서 오차 수정
				if (isSpark) {
					totalEligma += prob * 50;
					totalEleph += prob * 100;
				}
				
				// 10연차/고의천장전략 사용 시, 목표 달성 이후 마르코프 체인의 상태 공간이 불필요하게 확장되지 않도록 상한선 적용(p값이 목표를 달성한 시점부터는 종료 조건에 영향을 미치지 않기 때문에 달성도를 불필요하게 추적하여 연산량을 늘릴 필요가 없음)
				// *엘리그마/엘레프 획득량은 상한선의 적용 여부와 상관 없이 윗부분에서 정확하게 계산됨
				// 가챠 결과에 따른 4가지 갈래길
				const paths = [
					{ nxtP: Math.min(targetPickups, p + 1 + isSpark), pr: pBanner }, // 픽업 획득
					{ nxtP: Math.min(targetPickups, p + 1 + isSpark), pr: pOffTgt }, // 픽뚫 명함 획득
					{ nxtP: Math.min(targetPickups, p + 0 + isSpark), pr: pOwnFes }, // 픽뚫 중복 획득
					{ nxtP: Math.min(targetPickups, p + 0 + isSpark), pr: pTrash }   // 꽝
				];
				
				// 갈라진 평행우주들을 다음 턴(newDp)에 저장
				for (let path of paths) {
					if (path.pr > 0) {
						const probVal = prob * path.pr;
						// 확률이 너무 희박하면 연산 효율화를 위해 가지치기(설정에 따라 기준이 다르게 적용됨)
						if (probVal >= pruneThreshold) {
							newDp.set(path.nxtP, (newDp.get(path.nxtP) || 0.0) + probVal);
						}
					}
				}
			}
			
			// 가챠를 그만둬도 되는지(종료 조건) 판별
			const keysToRemove = [];
			for (let [nxtP, pVal] of newDp.entries()) {
				if (nxtP >= targetPickups) { // 목표치 달성
					let canStop = true;
					// 목표를 달성했어도 무료 100연 기간이거나, 10연차 도중이라면 중간에 멈출 수 없음
					// 무료 100연 기간인 경우, 일찍 목표를 달성했더라도 무료연을 버리지 않을 것이며,
					// 10연챠 단위로 돌리는 경우, 해당 연챠가 끝날 때까지는 가챠가 돌아가기 때문
					if (hasFree100 && i < 100) canStop = false;
					else if (is10Pull && (i % 10 !== 0)) canStop = false;
					
					if (canStop) {
						const progress = (i % 200 !== 0) ? (i % 200) : 200;
						// 고의 천장 전략 (기준점 이상 진행되었으면 다음 천장까지 무조건 돌림)
						if (useCeiling && progress >= ceilingTh && progress < 200) {
							// 고의 천장 전략 수행, 멈추지 않고 계속 진행
						} else {
							// 종료 조건이 만족되었으므로, 이 우주(경우의 수)에선 계산 종료
							pullsDist[i] += pVal; // 최종 기록에 추가
							keysToRemove.push(nxtP); // 계산에서 제외할 우주로 기록
						}
					}
				}
			}
			
			keysToRemove.forEach(k => newDp.delete(k)); // 이미 완료된 우주는 계산에서 제외
			dp = newDp;
		}
		endCDist.set(0, 1.0); // 기존 방식은 스택 이월 불가하므로 호출차지는 항상 0으로 끝남

	// ==========================================
	// 2. 신규 가챠 시스템 연산
	// ==========================================
	} else {
		// 초기 호출차지 설정 (없으면 0으로 시작)
		// 키 => 값 (획득수_호출차지스택 => 확률) 구조
		let dp = new Map();

		if (!initCDist) {
			dp.set("0_0", 1.0);
		} else {
			for (let [c, prob] of initCDist.entries()) {
				if (prob >= pruneThreshold) {
					dp.set(`0_${c}`, prob); // 호출차지 분포를 인계받아 획득수 0, 호출차지스택 c => 확률 prob 로 설정
				}
			}
		}
		
		for (let i = 1; i <= maxPulls; i++) {
			if (dp.size === 0) break;
			
			// [누적모집횟수 보상] - 자잘한 재화는 제외하고, 엘리그마와 10연챠 티켓만 반영 예정
			// 우선 해당 횟수 도달 시점의 전체 확률(살아있는 우주들의 합)만큼 엘리그마 보상 반영
			let currentProbSum = 0.0;
			for (let prob of dp.values()) currentProbSum += prob;
			
			if (i === 30) totalEligma += currentProbSum * 10;
			else if (i === 110) totalEligma += currentProbSum * 20;
			else if (i === 230) totalEligma += currentProbSum * 10;
			else if (i === 310) totalEligma += currentProbSum * 20;
			
			const isGuaranteed2Star = is10Pull && (i % 10 === 0);
			let nextDp = new Map();
			
			for (let [stateKey, prob] of dp.entries()) {
				// 문자열 형태의 stateKey를 분리하여 숫자로 변환
				const [p, c] = stateKey.split("_").map(Number);
				const cNext = c + 1; // 가챠 1회당 호출차지 스택 +1
				
				const remFes = Math.max(0, nTargets - p - 1);
				const ownFes = Math.max(0, nTargets - 1) - remFes;
				
				// 사용할 변수 선언 및 초기화
				let pBanner = 0.0, pOffTgt = 0.0, pOwnFes = 0.0, eEligma = 0.0, eEleph = 0.0;
				
				// [호출차지 100] 3성 확정 및 픽업 확률 50%
				if (cNext === 100) {
					// 호출차지 100회차에서 페스캐 픽뚫 확률이 픽뚫 50% 중 어떻게 분배되어 있는지 알 수 없으므로
					// (기존처럼 페스 픽뚫 확률 합산 0.9%(각 0.1%)가 유지되고 통상 3성 픽뚫 확률 49.1%일지,
					//  아니면 균등 비례 확장되어 페스 픽뚫 확률이 약 8.49%(각 0.9434%)로 확대될지 아직 알 수 없으므로,
					//  보수적으로 가정하여 호출차지 100 시점에서도 페스 픽뚫 확률 합산을 0.9%로 가정한다.)
					pBanner = 0.5;
					pOffTgt = isFes ? remFes * pOffIndiv : 0.0;
					pOwnFes = isFes ? ownFes * pOffIndiv : 0.0;
					eEligma = 50.0; // 3성 확정이므로, 일단은 중복으로 가정하여 엘리그마 50개 획득(추후, 목표 명함 개수만큼 다시 빼서 엘리그마 획득량을 정확하게 맞출 예정)
					eEleph = (0.5 * 100) + (pOwnFes * 30); // 50% 확률로 픽업캐 엘레프 100개 획득, 거기에 픽뚫로 목표 페스캐를 중복 획득할 확률로 목표 엘레프 30개 얻을 수 있는 점을 반영하여 계산. 픽뚫로 목표 페스캐 명함을 얻은 경우는 별도 엘레프 지급이 없으므로 엘레프 계산에선 합산하지 않음
				} 
				// [호출차지 200] 픽업 캐릭터 100% 확정
				else if (cNext === 200) {
					pBanner = 1.0;
					eEligma = 50.0; // 3성 확정이므로, 일단은 중복으로 가정하여 엘리그마 50개 획득(추후, 목표 명함 개수만큼 다시 빼서 엘리그마 획득량을 정확하게 맞출 예정)
					eEleph = 100.0; // 100% 확률로 픽업캐 엘레프 100개 획득
				} 
				// [일반 뽑기]
				else {
					pBanner = pPickup;
					pOffTgt = isFes ? remFes * pOffIndiv : 0.0;
					pOwnFes = isFes ? ownFes * pOffIndiv : 0.0;
					
					const p2Act = isGuaranteed2Star ? (1.0 - p3StarTotal) : p2Star;
					const p1Act = isGuaranteed2Star ? 0.0 : p1Star;
					
					eEligma = (p3StarTotal * 50) + (p2Act * 10) + (p1Act * 1);
					eEleph = (pBanner * 100) + (pOwnFes * 30); // 50% 확률로 픽업캐 엘레프 100개 획득, 거기에 픽뚫로 목표 페스캐를 중복 획득할 확률로 목표 엘레프 30개 얻을 수 있는 점을 반영하여 계산. 픽뚫로 목표 페스캐 명함을 얻은 경우는 별도 엘레프 지급이 없으므로 엘레프 계산에선 합산하지 않음
				}
				
				const pTrash = 1.0 - pBanner - pOffTgt - pOwnFes; // 꽝 확률
				
				totalEligma += prob * eEligma;
				totalEleph += prob * eEleph;
				
				// 10연차 모드에서 목표 달성 이후 마르코프 체인의 상태 공간이 불필요하게 확장되지 않도록 상한선 적용(p값이 목표를 달성한 시점부터는 종료 조건에 영향을 미치지 않기 때문에 달성도를 불필요하게 추적하여 연산량을 늘릴 필요가 없음)
				// *엘리그마/엘레프 획득량은 상한선의 적용 여부와 상관 없이 정확하게 계산됨
				const paths = [
					{ nxtP: Math.min(targetPickups, p + 1), nxtC: 0, pr: pBanner }, // 픽업 획득시 호출차지 초기화 (nxtC: 0)
					{ nxtP: Math.min(targetPickups, p + 1), nxtC: cNext, pr: pOffTgt }, // 픽뚫로 목표를 획득했더라도 호출차지는 초기화되지 않음
					{ nxtP: Math.min(targetPickups, p), nxtC: cNext, pr: pOwnFes }, // 픽뚫로 목표 중복 획득시에는 목표 달성도를 올리지 않음(엘레프 계산은 위에서 이미 반영됨)
					{ nxtP: Math.min(targetPickups, p), nxtC: cNext, pr: pTrash }
				];
				
				for (let path of paths) {
					if (path.pr > 0) {
						const probVal = prob * path.pr;
						if (probVal >= pruneThreshold) {
							const newKey = `${path.nxtP}_${path.nxtC}`;
							nextDp.set(newKey, (nextDp.get(newKey) || 0.0) + probVal);
						}
					}
				}
			}
			
			// 종료 조건 판별
			const keysToRemove = [];
			const ticketMilestones = [70, 130, 150, 170, 330, 350, 370]
			
			// 무료 100회 모집 / 누적모집보상으로 얻은 티켓 갯수에 따라 최소 가챠 횟수를 동적으로 계산
			// 무료 100회 모집 기간에는 목표를 조기달성하더라도 나머지 무료 모집 횟수를 모두 사용할 것이며,
			// 누적모집보상으로 얻은 10회 모집 티켓은 해당 픽업에서 즉시 사용하는 것으로 가정하기 때문.
			// (실제로는 티켓 기간이 40일이므로 다음 기간에 사용한다면 효율이 더 좋겠지만,
			//  이 부분은 추후 구현 예정 - 각 기간에 대해 사용자가 "누적모집보상 티켓이 1장 남은 경우
			//  다음 픽업에 사용(사용기한 40일)" 옵션을 체크했다면 이번 기간의 최소 가챠 횟수에 미반영 및
			//  다음 기간으로 티켓 이월)
			let forcedPull = hasFree100 ? 100 : 0;
			for (let m of ticketMilestones) {
				if (i >= m) {
					maxForcedPull = Math.max(forcedPull, m) + 10;
				}
			}
			
			for (let [stateKey, pVal] of nextDp.entries()) {
				const [nxtP, nxtC] = stateKey.split("_").map(Number);
				
				if (nxtP >= targetPickups) { // 목표치 달성
					let canStop = true;
					
					// 동적으로 계산된 최소 모집 횟수(무료 100연 + 누적모집보상 티켓들)에 도달하지 못했다면 중단 불가
					// 또한 10연챠 단위로 돌리는 경우, 해당 연챠가 끝날 때까지는 가챠가 돌아감
					if (i < forcedPull) canStop = false;
					else if (is10Pull && (i % 10 !== 0)) canStop = false;
					
					if (canStop) {
						pullsDist[i] += pVal;
						// 다음 픽업으로 이월하기 위해 종료 시점의 호출차지 분포를 기록해둠
						endCDist.set(nxtC, (endCDist.get(nxtC) || 0.0) + pVal);
						keysToRemove.push(stateKey);
					}
				}
			}
			
			keysToRemove.forEach(k => nextDp.delete(k));
			dp = nextDp;
		}
		
		// 소수점 계산 누적 오차를 잡아주기 위해 정규화
		let totalEndCProb = 0.0;
		for (let p of endCDist.values()) totalEndCProb += p;
		
		if (totalEndCProb > 0) {
			let normalizedCDist = new Map();
			for (let [c, p] of endCDist.entries()) {
				normalizedCDist.set(c, p / totalEndCProb);
			}
			endCDist = normalizedCDist;
		} else {
			endCDist = initCDist ? new Map(initCDist) : new Map([[0, 1.0]]);
		}
	}
	
	// ---------------------------------------------------------
	// 3. 엘리그마 재계산 및 무료 100회 모집 / 누적모집티켓 반영
	// ---------------------------------------------------------
	// 아까 위에서 "모든 학생 획득을 중복으로 가정"하고 엘리그마를 50개씩 다 줬기 때문에,
	// 명함 개수(중복으로 뽑지 않은 횟수)만큼은 50개씩 다시 빼줘서 정확하게 계산
	totalEligma -= nTargets * 50;
	
	// 신규 시스템에서 누적모집보상으로 페이백받은 10회 모집 티켓을 썼다면,
	// 해당 티켓의 사용분만큼 내 청휘석을 안 쓴 것임.
	// 따라서 무료 제공 회차를 제외하고 '실제 내 청휘석으로 뽑은 횟수'를 계산해줌
	if (systemType === "new") {
		const ticketMilestones = [70, 130, 150, 170, 330, 350, 370];
		let newDist = new Array(pullsDist.length).fill(0.0);
		
		for (let idx = 0; idx < pullsDist.length; idx++) {
			const prob = pullsDist[idx];
			if (prob < pruneThreshold) continue;
			
			let freePulls = 0;
			for (let m of ticketMilestones) {
				if (idx > m) freePulls += Math.min(10, idx - m); // 이미 시뮬레이션 과정에서 무료 티켓 사용 구간에서의 10연챠의 불가분성(예: 10회 모집 티켓을 3회분만 사용하고 가챠가 종료되는 것은 불가)을 적용했으므로 실제론 idx - m 값이 10 미만일 수 없겠지만, 안전하게 로직 작성
			}
			
			// 실제 내 청휘석이 소모된 횟수 (순소모 가챠횟수)
			const paidCost = Math.max(0, idx - freePulls); // 여기서도, 실제론 idx - freePulls 값이 음수일 수 없겠지만 안전하게 로직 작성
			newDist[paidCost] += prob;
		}
		pullsDist = newDist;
	}
	
	// 무료 100연 적용
	if (hasFree100) {
		let resD = [];
		for (let idx = 0; idx < pullsDist.length; idx++) {
			const prob = pullsDist[idx];
			const cost = Math.max(0, idx - 100); // 이미 시뮬레이션 과정에서 무료 100연차 진행 중 목표를 달성하더라도 남은 무료 모집 횟수를 모두 사용하도록 되어 있으므로 실제론 idx - 100 값이 음수일 수 없겠지만, 안전하게 로직 작성
			while (resD.length <= cost) resD.push(0.0);
			resD[cost] += prob;
		}
		pullsDist = resD;
	}
	
	// 실질적인 평균 가챠 횟수 최종 계산
	let paidAvgPulls = 0.0;
	for (let i = 0; i < pullsDist.length; i++) {
		paidAvgPulls += i * pullsDist[i];
	}
	
	return {
		avgPulls: paidAvgPulls,
		avgEligma: totalEligma,
		avgEleph: totalEleph,
		pullsDist: pullsDist,
		endCDist: endCDist
	};
}

/**
 * UI 이벤트를 처리하고 시뮬레이션을 실행한 뒤 결과를 화면에 출력
 */
async function runSimulation() {
	// 계산 시작 시 버튼 비활성화
	const runBtn = document.getElementById("run-btn");
	runBtn.disabled = true;
	document.getElementById("toggle-plot-btn").disabled = true;
	document.getElementById("save-img-btn").disabled = true;
	// 기존 그래프 삭제
	Plotly.purge("plot-cumulative")
	Plotly.purge("plot-regular")
	
	const outDiv = document.getElementById("text-output");
	
	// UI에서 설정값 읽기
	let pruneVal = parseFloat(document.getElementById("prune-threshold").value);
	pruneVal = isNaN(pruneVal) ? 1e-8 : pruneVal;
	let pctStr = document.getElementById("percentiles").value;
	let pctList = [...new Set(pctStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n)))].sort((a, b) => a - b);
	if (pctList.length === 0) pctList = [1, 5, 10, 25, 50, 75, 90, 95, 99];
	
	// 기간별 데이터 배열 만들기
	const rows = document.querySelectorAll(".period-row");
	const periods = [];
	rows.forEach(row => {
		periods.push({
			n: parseInt(row.querySelector(".p_targets").value) || 1,
			d: parseInt(row.querySelector(".p_dupes").value) || 0,
			system: row.querySelector(".p_system").value,
			is_fes: row.querySelector(".p_fes").checked,
			has_free100: row.querySelector(".p_free100").checked,
			is_10pull: row.querySelector(".p_10pull").checked,
			use_ceiling: row.querySelector(".p_ceiling").checked,
			ceiling_th: parseInt(row.querySelector(".p_ceiling_th").value) || 150,
			memo: row.querySelector(".p_memo").value.trim()
		});
	});

	outDiv.innerText = "확률 분포를 계산하고 있습니다. 잠시만 기다려주세요...";
	
	// 전역 누적 변수 초기화
	let totalDist = [1.0];
	let tPulls = 0.0, tEligma = 0.0, tEleph = 0.0;
	
	let initC = parseInt(document.getElementById("init-charge").value) || 0; // 사용자가 설정한 초기 호출차지 값 읽어오기
	initC = Math.max(0, Math.min(199, initC));
	
	let currentCDist = new Map();
	currentCDist.set(initC, 1.0);
	
	const totalPeriods = periods.length;
	
	let startTime = Date.now()
	for (let i = 0; i < totalPeriods; i++) {
		const p = periods[i];
		
		runBtn.innerText = `계산 중... (${i}/${totalPeriods})`;
		
		await new Promise(resolve => setTimeout(resolve, 10));
		
		const res = simulatePullsToTarget({
			nTargets: p.n, dDupes: p.d, systemType: p.system,
			isFes: p.is_fes, hasFree100: p.has_free100, is10Pull: p.is_10pull,
			useCeiling: p.use_ceiling, ceilingTh: p.ceiling_th,
			initCDist: currentCDist, pruneThreshold: pruneVal
		});
		
		currentCDist = res.endCDist;
		totalDist = convolveDists(totalDist, res.pullsDist, pruneVal);
		
		tPulls += res.avgPulls;
		tEligma += res.avgEligma;
		tEleph += res.avgEleph;
	}
	console.log(`계산 실제 소요 시간: ${Date.now() - startTime - totalPeriods * 10}ms / pruneVal=${pruneVal}`)

	// 결과 텍스트 생성 및 출력
	const pctRes = getPercentiles(totalDist, pctList);
	const tPyrox = tPulls * 120;
	
	let resultText = `=========================================\n`;
	resultText +=	 `        블루 아카이브 가챠 플래너\n`;
	resultText +=	 `=========================================\n\n`;
	resultText += `▶ [전체 기간 목록]\n`;
	
	periods.forEach((p, i) => {
		const sysName = p.system === "new" ? "신규" : "기존";
		const memo = p.memo || `기간 ${i + 1}`;
		let ceilingText = "";
		if (p.system === "old") {
			ceilingText += ` / 고의천장전략: ${p.use_ceiling ? "사용" : "미사용"}`;
			if (p.use_ceiling) ceilingText += ` (기준점 ${p.ceiling_th}스택)`;
		}
		resultText += ` - ${i + 1}. ${memo} (시스템: ${sysName} / 목표명함: ${p.n} / 중복: ${p.d}${ceilingText})\n\n`;
	});
	
	// 행운도(백분위수)에 따른 색상 생성 함수
	// 행운도가 높을수록 초록, 낮을수록 빨강에 가까운 색상을 반환
	const getLuckColor = (percentile) => {
		let hue, lightness;
		if (percentile <= 50) {
			hue = 120 - (percentile / 50.0) * 80;
			lightness = 35 - (percentile / 50.0) * 25;
		} else {
			hue = 40 - ((percentile - 50.0) / 49.0) * 40;
			lightness = 10 + ((percentile - 50.0) / 49.0) * 40;
		}
		hue = Math.max(0, hue);
		lightness = Math.min(50, lightness);
		return `hsl(${hue.toFixed(1)}, 100%, ${lightness.toFixed(1)}%)`;
	};
	
	resultText += `\n▶ [청휘석 필요량 요약]\n`;
	resultText += `  • 평균 기대 청휘석 소모 : ${tPyrox.toLocaleString('ko-KR', {maximumFractionDigits:0})} 개 (${tPulls.toFixed(2)}뽑)\n`;
	
	if (pctRes[95] !== undefined) {
		const colorCode = getLuckColor(95);
		resultText += `  • 운 <span style='color:${colorCode}; font-weight:bold;'>하위 5%</span> 기준 청휘석: <span style='color:${colorCode}; font-weight:bold;'>${(pctRes[95] * 120).toLocaleString('ko-KR')} 개</span> (${pctRes[95]}뽑)\n`;
	}
	
	resultText += `\n▶ [상위 %별 필요 청휘석(운 척도)]\n`;
	Object.keys(pctRes).sort((a,b)=>a-b).forEach(k => {
		const pyrox = pctRes[k] * 120;
		const colorCode = getLuckColor(k);
		const prefix = k <= 50 ? `상위 ${String(k).padStart(2, ' ')}%` : `하위 ${String(100 - k).padStart(2, ' ')}%`;
		resultText += `  - 운 <span style='color:${colorCode}; font-weight:bold;'>${prefix}</span>: <span style='color:${colorCode}; font-weight:bold;'>${pyrox.toLocaleString('ko-KR')} 청휘석</span> (${pctRes[k]}뽑)\n`; // .padStart(8, ' ')
	});
	
	let eligmaRateText = "";
	let elephRateText = "";
	
	if (tPulls > 0.0001) {
		const eligmaRate = tEligma / tPulls;
		const elephRate = tEleph / tPulls;
		eligmaRateText = ` (120청휘석당 ${eligmaRate.toFixed(2)}개)`;
		elephRateText = ` (120청휘석당 ${elephRate.toFixed(2)}개)`;
	} else {
		// 순소모 가챠 횟수가 0인 경우 효율 계산 불가하므로 대체 텍스트 출력
		eligmaRateText = ` (청휘석 소모 없이 획득)`;
		elephRateText = ` (청휘석 소모 없이 획득)`;
	}
	
	resultText += `\n▶ [부가 재화 획득 기대량]\n`;
	resultText += `  - 엘리그마 : ${tEligma.toLocaleString('ko-KR', {maximumFractionDigits:0})} 개${eligmaRateText}\n`;
	resultText += `  - 목표 엘레프: ${tEleph.toLocaleString('ko-KR', {maximumFractionDigits:0})} 개${elephRateText}\n`;
	
	resultText += `\n▶ [참고사항]\n`;
	resultText += `  - 무과금 유저는 월평균 약 9,600 청휘석 이상<div class="tooltip">?<span class="tooltiptext">- 일간 미션 : 20*30 = 600
- 주간 미션 : 120*4 = 480
- 출석 미션 합계 : 450
- 전술대회 일일 보상(in 1000) : 18*30 = 540
- 총력전 일간 미션 + 누적 점수 보상 : 720
- 총력전 랭킹 보상(골드) : 1,000
- 대결전 미션 : 70
- 대결전 10회 모집 티켓 : 1,200
- 종합전술시험 일간 미션 : 10*7 = 70
- 제약해제결전 미션: 10
- 점검 보상 : 600*2 = 1,200
- 이벤트 보상(월평균 1.5회 개최) : 평균 2,000*1.5 = 약 3,000
- 그 외의 수급처(방송 기념 보상, 리딤 코드, 웹이벤트 보상, 새로운 지역의 도전과제/업적, 메인 스토리/인연 스토리 보상 등)</span></div>,\n`;

	resultText += `  - 월정액 유저는 약 12,000 청휘석 이상<div class="tooltip">?<span class="tooltiptext">- 월정액 : 392 + 40*30 = 1,592
- 월정액 Half : 176 + 20*30 = 776</span></div> 획득\n`;

resultText += `(대결전 티켓을 쓰지 않는다면 해당분은 제하여 계산)\n`;
	
	resultText += `\n<span style='color: #6c757d;'>https://bagachasimul.github.io/ba-gacha-simul</span>`;
	
	outDiv.innerHTML = resultText;

	// ----------------- Plotly 시각화 (청휘석 기준) -----------------
	let maxIdx = totalDist.length - 1;
	while (maxIdx > 0 && totalDist[maxIdx] < 1e-6) maxIdx--;
	
	
	
    const xPyrox = [], yDist = [], yCum = [];
    let cumSum = 0;
    
    for (let i = 0; i <= maxIdx; i++) {
        // 누적 성공 확률(CDF) 연산을 위해 전체 확률 합산은 건너뛰지 않고 매번 수행합니다.
        cumSum += totalDist[i]; 
        
        // 예를 들어 10회 모집 옵션이 활성화된 경우, 확률이 0인 구간이 많아
		// PMF 그래프에 대한 호버링 툴팁을 정상적으로 열람할 수 없음
		// 그래프에 표시할 데이터의 필터링 기준은 부동소수점 오차를 감안하면서도
		// 실제 데이터가 잘려나가지 않도록 1e-10으로 설정
        if (totalDist[i] > 1e-10) {
            xPyrox.push(i * 120);
            yDist.push(totalDist[i]);
            yCum.push(cumSum);
        }
    }
	
	const traceReg = {
		x: xPyrox,
		y: yDist,
		type: "scatter",
		mode: "lines+markers",
		name: "해당 구간 확률(Probability)",
		line: {color: "rgba(40, 167, 69, 0.8)", width: 1},
		marker: {
            size: 2,
            color: "rgba(40, 167, 69, 1.0)"
        },
		hovertemplate: "at %{x:,.0f} -> %{y:.4%}<extra></extra>"
	};
	
	const traceAvgReg = {
		x: [tPyrox, tPyrox],
		y: [0, Math.max(...yDist) * 1.05],
		type: "scatter",
		mode: "lines",
		name: `평균 (Average): ${tPyrox.toLocaleString('ko-KR', {maximumFractionDigits:0})} 청휘석`,
		line: {color: "#d32f2f", dash: "dash"}, hoverinfo: "skip"
	};
	
	
	// ==========================================
	// 차트 레이아웃 및 X축 눈금(Scale) 스케일 설정
	// ==========================================
	const xAxisConfig = {
		title: "순소모 청휘석(Net Used Pyroxenes)",
		tick0: 0,
		ticklen: 4,
		dtick: 12000,
		//tickformat: ",",
		minor: {
			dtick: 6000,
			tick0: 0,
			showgrid: true,
			gridcolor: "rgba(0,0,0,0.05)"
		}
	};

	const layoutReg = { 
		title: "이산 확률 분포 (PMF)", 
		xaxis: xAxisConfig, 
		yaxis: {title: "해당 구간 확률(Probability)"}, 
		hovermode: "x unified",
		legend: { orientation: "h", yanchor: "top", y: -0.3, xanchor: "center", x: 0.5 }, // 범례 가로 배치 및 하단 이동
		margin: { l: 45, r: 15, t: 100, b: 80 } // 그래프 좌우 여백 축소
	};
	
	const layoutCum = { 
		title: "누적 성공 확률 분포 (CDF)", 
		xaxis: xAxisConfig, 
		yaxis: {title: "누적 성공 확률(Cumulative Prob.)", range: [0, 1.05]}, 
		hovermode: "x unified",
		legend: { orientation: "h", yanchor: "top", y: -0.3, xanchor: "center", x: 0.5 }, // 범례 가로 배치 및 하단 이동
		margin: { l: 45, r: 15, t: 100, b: 80 } // 그래프 좌우 여백 축소
	};
	
	const traceCum = {
		x: xPyrox,
		y: yCum,
		type: "scatter",
		mode: "lines",
		name: "누적 성공 확률(Cumulative Prob.)",
		line: {color: "#0056b3", shape: "hv"},
		hovertemplate: "≤ %{x:,.0f} 청휘석 -> %{y:.2%}<extra></extra>"
	};
	
	const pctX = [], pctY = [], pctText = [];
	Object.keys(pctRes).sort((a, b) => a - b).forEach(k => {
		pctX.push(pctRes[k] * 120);
		pctY.push(k / 100.0);
		
		// 툴팁에 띄워줄 텍스트 생성 (상위 50%까지는 상위, 나머지는 하위로 표기)
		const label = k <= 50 ? `상위(Top) ${k}%` : `하위(Bottom) ${100 - k}%`;
		pctText.push(label);
	});
	
	const tracePct = { 
		x: pctX, 
		y: pctY, 
		text: pctText,
		type: "scatter", 
		mode: "markers", 
		marker: { symbol: "diamond", size: 10, color: "#d32f2f" }, 
		name: "백분위수 마커(Percentile Marker)", 
		hovertemplate: "<b>%{text}</b><br>순소모 청휘석: %{x:,.0f}개<extra></extra>" 
	};
	
	const traceAvgCum = {
		x: [tPyrox, tPyrox],
		y: [0, 1.05],
		type: "scatter",
		mode: "lines",
		name: `평균(Average): ${tPyrox.toLocaleString('ko-KR', {maximumFractionDigits:0})} 청휘석`,
		line: {color: "red", dash: "dash"}, hoverinfo: "skip"
	};

	Plotly.newPlot("plot-regular", [traceReg, traceAvgReg], layoutReg);
	Plotly.newPlot("plot-cumulative", [traceCum, tracePct, traceAvgCum], layoutCum);
	
	document.getElementById("toggle-plot-btn").innerText = "이산 확률 분포(PMF) 보기"
	document.getElementById("toggle-plot-btn").disabled = false;
	document.getElementById("save-img-btn").disabled = false;
	document.getElementById("plot-cumulative").style.display = "block";
	document.getElementById("plot-regular").style.display = "none";
	runBtn.innerText = "계산 실행하기";
	runBtn.disabled = false;
}

// UI 토글 함수 및 초기화
document.addEventListener('DOMContentLoaded', () => {
	const runBtn = document.getElementById("run-btn");
	runBtn.disabled = false;
	runBtn.innerText = "계산 실행하기";
	runBtn.addEventListener("click", runSimulation);

	document.getElementById("toggle-plot-btn").addEventListener("click", () => {
		const btn = document.getElementById("toggle-plot-btn");
		const plotCum = document.getElementById("plot-cumulative");
		const plotReg = document.getElementById("plot-regular");

		if (plotCum.style.display !== "none") {
			plotCum.style.display = "none";
			plotReg.style.display = "block";
			btn.innerText = "누적 확률 분포(CMF) 보기";
		} else {
			plotCum.style.display = "block";
			plotReg.style.display = "none";
			btn.innerText = "이산 확률 분포(PMF) 보기";
		}
	});
});

	<!-- UI 및 LocalStorage 제어 -->
	<script>
const STORE_KEY = 'baGachaPlan';

function createPeriodRowHTML(idx, data = {}) {

			<div class="period-targets">
				<label>명함: <input type="number" class="p_targets save-target" value="${n}" min="1"> 명</label>
				<label>픽업 중복: <input type="number" class="p_dupes save-target" value="${d}" min="0"> 번</label>
			</div>
			
			<!-- 옵션 설정 영역 (체크박스) -->
			<div class="period-options" style="flex-grow: 1;">
				<label><input type="checkbox" class="p_free100 save-target" ${f100}> 무료 100회</label>
				<label><input type="checkbox" class="p_fes save-target" ${fes}> Fes(3★ 6%)</label>
				<label>
					<input type="checkbox" class="p_10pull save-target" ${p10}> 10회 모집 
					<div class="tooltip">?<span class="tooltiptext">10회 모집 단위로 가챠를 진행하며, 10회차에 2성 이상이 보장됩니다.</span></div>
				</label>
			</div>
			
			<!-- 고의천장 설정 영역 -->
			<div class="ceiling-wrapper" style="display: ${showCeiling}; flex-grow: 1;">
				<label>
					<input type="checkbox" class="p_ceiling save-target" onchange="toggleCeilingTh(this)" ${ceil}> 고의 천장 전략 
					<div class="tooltip">?<span class="tooltiptext">기존 가챠에서, 도중에 목표를 달성하더라도 다음 천장까지 가챠를 돌리는 전략입니다. 소모되는 청휘석은 증가하는 대신, 보정치(천장 교환)를 획득한 직후 가챠를 종료하므로 기존 가챠에서 1뽑당 엘리그마/엘레프 획득효율이 가장 높은 전략입니다.</span></div>
				</label>
				<label class="ceiling-th-container" style="display: ${ceil?'inline-flex':'none'};">
					기준점: <input type="number" class="p_ceiling_th save-target" value="${ceil_th}" min="0" max="199">
					<div class="tooltip">?<span class="tooltiptext">고의 천장 전략을 사용할 기준점입니다. 예를 들어, 150을 입력한 경우 150스택 미만(다음 천장까지 50뽑 초과 남음)에서 목표를 달성했을 때는 가챠를 즉시 중단하며, 150스택 이상(다음 천장까지 50뽑 이하 남음)에서 목표를 달성했을 때는 고의 천장을 수행합니다.<br>0이 입력된다면 항상 고의 천장 전략을 사용합니다.<br>항상 고의천장 전략을 사용하는 것이 1뽑당 엘리그마/엘레프 획득효율은 가장 높지만, 그만큼 청휘석 소모량이 많아집니다.</span></div>
				</label>
			</div>
		</div>
	`;
}

function addPeriod(data = {}) {
	const container = document.getElementById('plan-container');
	const idx = container.children.length + 1;
	container.insertAdjacentHTML('beforeend', createPeriodRowHTML(idx, data));
	updateRemoveButtons();
	saveData();
}

function removePeriod(btn) {
	const container = document.getElementById('plan-container');
	if (container.children.length > 1) {
		btn.closest('.period-row').remove();
		// 번호 재정렬
		Array.from(container.children).forEach((row, i) => {
			row.querySelector('strong').innerText = `${i+1}. `;
		});
		updateRemoveButtons();
		saveData();
	}
}

function updateRemoveButtons() {
	const btns = document.querySelectorAll('.remove-btn');
	btns.forEach(b => b.disabled = (btns.length === 1));
}

function toggleCeilingTh(checkboxElem) {
	const thContainer = checkboxElem.closest('.period-row').querySelector('.ceiling-th-container');
	thContainer.style.display = checkboxElem.checked ? 'inline-block' : 'none';
	saveData();
}

function toggleSystem(selectElem) {
	const row = selectElem.closest('.period-row');
	const ceilingWrapper = row.querySelector('.ceiling-wrapper');
	const ceilingCheckbox = row.querySelector('.p_ceiling');
	const ceilingThContainer = row.querySelector('.ceiling-th-container');

	if (selectElem.value === 'old') {
		// 기존 방식일 때 표시
		ceilingWrapper.style.display = 'inline-block';
	} else {
		// 신규 방식일 때 숨김 처리 및 체크 자동 해제
		ceilingWrapper.style.display = 'none';
		if (ceilingCheckbox.checked) {
			ceilingCheckbox.checked = false;
			ceilingThContainer.style.display = 'none';
		}
	}
}

function saveData() {
	const data = {
		prune: document.getElementById('prune-threshold').value,
		init_c: document.getElementById('init-charge').value,
		pct: document.getElementById('percentiles').value,
		periods: []
	};
	document.querySelectorAll('.period-row').forEach(row => {
		data.periods.push({
			system: row.querySelector('.p_system').value,
			n: row.querySelector('.p_targets').value,
			d: row.querySelector('.p_dupes').value,
			has_free100: row.querySelector('.p_free100').checked,
			is_fes: row.querySelector('.p_fes').checked,
			is_10pull: row.querySelector('.p_10pull').checked,
			use_ceiling: row.querySelector('.p_ceiling').checked,
			ceiling_th: row.querySelector('.p_ceiling_th').value,
			memo: row.querySelector('.p_memo').value
		});
	});
	localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

function loadData() {
	const raw = localStorage.getItem(STORE_KEY);
	if (raw) {
		try {
			const data = JSON.parse(raw);
			document.getElementById('prune-threshold').value = data.prune || "1e-8";
			document.getElementById('init-charge').value = data.init_c || "0";
			document.getElementById('percentiles').value = data.pct || "1, 5, 10, 25, 50, 75, 90, 95, 99";
			
			const container = document.getElementById('plan-container');
			container.innerHTML = '';
			(data.periods || [{}]).forEach(p => addPeriod(p));
		} catch (e) {
			console.error("데이터 복구 실패:", e);
			document.getElementById('plan-container').innerHTML = '';
			addPeriod(); // 실패시 기본 1개
		}
	} else {
		addPeriod();
	}
}

function exportData() {
	saveData();
	const raw = localStorage.getItem(STORE_KEY);
	navigator.clipboard.writeText(raw).then(() => {
		alert("현재 설정 데이터가 텍스트로 복사되었습니다. 백업용으로 안전한 곳에 보관하세요.");
	}).catch(err => {
		prompt("클립보드 복사에 실패했습니다. 아래 텍스트를 직접 복사해주세요.", raw);
	});
}

function importData() {
	const input = prompt("백업해둔 데이터 텍스트를 붙여넣어 주세요:");
	if (input) {
		try {
			JSON.parse(input); // 유효성 검사
			localStorage.setItem(STORE_KEY, input);
			alert("성공적으로 복원되었습니다.");
			location.reload();
		} catch(e) {
			alert("올바르지 않은 데이터 형식입니다.");
		}
	}
}

function resetData() {
	if (confirm("경고: 저장된 모든 설정 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.")) {
		localStorage.removeItem(STORE_KEY);
		location.reload();
	}
}

function saveAsImage() {
	const btn = document.getElementById('save-img-btn');
	const originalText = btn.innerText;
	
	btn.innerText = '이미지 생성 중...';
	btn.disabled = true;

	const target = document.getElementById('capture-area');
	
	setTimeout(() => {
		html2canvas(target, { 
			backgroundColor: '#ffffff', 
			scale: 2,
			useCORS: true // 차트나 폰트 렌더링 누락 방지
		}).then(canvas => {
			const link = document.createElement('a');
			link.download = 'ba_gacha_result.png'; // 저장될 파일명
			link.href = canvas.toDataURL('image/png');
			link.click();
			
			// 버튼 상태 원상복구
			btn.innerText = originalText;
			btn.disabled = false;
		}).catch(error => {
			console.error("이미지 캡처 실패:", error);
			alert("이미지를 저장하는 중 오류가 발생했습니다.");
			btn.innerText = originalText;
			btn.disabled = false;
		});
	}, 500);
}

document.addEventListener('DOMContentLoaded', () => {
	loadData();
	// 입력값이 변경될 때마다 자동 저장
	document.addEventListener('input', (e) => {
		if(e.target.classList.contains('save-target')) saveData();
	});
	document.addEventListener('change', (e) => {
		if(e.target.classList.contains('save-target')) saveData();
	});
});
	</script>
</body>
</html>
